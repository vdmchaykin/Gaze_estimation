name: gaze_env
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - cudatoolkit=11.8
  - numpy
  - scipy
  - scikit-image
  - scikit-learn
  - opencv
  - matplotlib
  - pillow
  - tqdm
  - pip
  - pip:
      - einops
      - timm
      - opencv-contrib-python
